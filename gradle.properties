org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.nonTransitiveRClass=true

# The app is plain Java. AGP 9's built-in Kotlin otherwise adds kotlin-stdlib
# (~10K methods) to every app, which would push a minSdk 16 app toward the 64K
# dex method limit and legacy multidex (docs/02-platform-constraints.md §2).
kotlin.stdlib.default.dependency=false

# Only 32-bit native libraries on purpose: Android 4.x has no 64-bit devices, and
# 64-bit devices run the 32-bit libraries.
android.sync.suppressAgpWarnings=EXTERNAL_NATIVE_BUILD_CONFIGURATION
