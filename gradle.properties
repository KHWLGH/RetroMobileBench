org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.nonTransitiveRClass=true

# Keep the plain Java app free of AGP's implicit Kotlin standard library and
# below the legacy single-dex method limit (docs/development.md).
kotlin.stdlib.default.dependency=false

# Only 32-bit native libraries for legacy devices; newer devices must support
# the packaged 32-bit ABI (docs/development.md).
android.sync.suppressAgpWarnings=EXTERNAL_NATIVE_BUILD_CONFIGURATION
