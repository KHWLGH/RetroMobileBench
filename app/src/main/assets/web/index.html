<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RMB Web portrait feed</title>
<style>
html,body { margin:0; padding:0; width:100%; min-height:100%; font:12px/18px sans-serif; background:#f2f4f7; color:#1f262d; -webkit-text-size-adjust:100%; }
#work { width:100%; overflow:hidden; }
.card { -webkit-box-sizing:border-box; box-sizing:border-box; width:96%; margin:4px auto; padding:6px; border:1px solid #c5ccd3; background:#ffffff; }
.card img { width:100%; height:96px; display:block; margin-bottom:4px; }
h3,p { margin:0; font:12px/18px sans-serif; }
.card h3 { font-weight:bold; color:#111; }
.meta { color:#567; margin-top:2px; }
.done { text-decoration:line-through; color:#889; }
ul { margin:0; padding:0; list-style:none; }
li { height:20px; padding:0 6px; border-bottom:1px solid #e1e5ea; background:#fff; }
.hit { background:#ffdf70; }
.viewer { -webkit-box-sizing:border-box; box-sizing:border-box; width:96%; margin:6px auto; padding:6px; border:1px solid #456; background:#1c2228; color:#eef2f6; }
.viewer canvas { width:100%; height:160px; display:block; margin-top:4px; background:#000; }
</style></head><body><div id="work"></div><script src="corpus.js"></script><script src="bench.js"></script></body></html>
